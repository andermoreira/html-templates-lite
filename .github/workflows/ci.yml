name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} — syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Faixa declarada no cabeçalho do plugin: Requires PHP 7.4.
        # 8.0/8.1 não recebem mais patches upstream, mas usuários rodam.
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax (php -l)
        run: |
          for f in *.php includes/*.php; do
            php -l "$f" || exit 1
          done

      - name: JS syntax (node --check)
        if: matrix.php == '8.3'
        run: |
          node --check assets/admin.js
          node --check assets/settings.js

  phpcs:
    name: PHPCS — WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Advisory enquanto o código não está 100% limpo — o job reporta
      # como warning e NÃO bloqueia o merge. Para bloquear, remova
      # continue-on-error após zerar os relatórios.
      - name: PHPCS (advisory)
        continue-on-error: true
        run: vendor/bin/phpcs --standard=WordPress --extensions=php --ignore=*/vendor/* --parallel=8 .
